name: Build Windows EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pyinstaller PyQt6 translators deep-translator pystray pillow pyperclip
      - name: Build with PyInstaller
        run: pyinstaller --noconsole --onefile --name="MyTranslator" main.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTranslator-Windows
          path: dist/MyTranslator.exe
